name: Profile cards

# Rebuilds the activity panel and contribution snake daily, and publishes them
# to the `output` branch so main stays free of bot commits. Only public data is
# read, so the default GITHUB_TOKEN is enough.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile.yml"
      - "tools/**"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Activity panel
        run: |
          pip install --quiet fonttools brotli
          python tools/activity.py dist/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      # snk runs in a root-owned container, so it goes after the steps that create dist/.
      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ffffff&color_dots=#161616,#0a2a66,#0943a0,#0055df,#4a8eff
            dist/snake-light.svg?color_snake=#010101&color_dots=#ebedf0,#b9cdf3,#6f9cf0,#0055df,#0943a0

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
