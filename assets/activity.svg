<svg xmlns="http://www.w3.org/2000/svg" width="840" height="132" viewBox="0 0 840 132" xml:space="preserve" role="img" aria-label="On GitHub: stats, top languages and contribution graph.">
<title>On GitHub: stats, top languages and contribution graph.</title>
<defs><clipPath id="panel"><rect width="840" height="132" rx="14"/></clipPath></defs>
<style>@font-face{font-family:'Aspekta';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'SiteMono';src:url(data:font/woff2;base64,) format('woff2');}.s{font-family:'Aspekta',Arial, sans-serif}.m{font-family:'SiteMono',ui-monospace, Menlo, Consolas, monospace}@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes pulse{0%{r:3.5px;opacity:.7}100%{r:11px;opacity:0}}.pulse{animation:pulse 2s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}text{white-space:pre}</style>
<g clip-path="url(#panel)">
<rect width="840" height="132" fill="#010101"/>
<text x="40.0" y="48.0" font-size="11.5" letter-spacing="0.08em" class="m fu"><tspan fill="#4a8eff">07</tspan><tspan fill="#ffffff99">   ACTIVITY</tspan></text>
<line x1="159.66000000000003" y1="44.5" x2="800" y2="44.5" stroke="#ffffff1a"/>
<text x="40.0" y="98.0" font-size="34" fill="#ffffff" letter-spacing="-0.03em" class="s fu" style="animation-delay:0.08s">On GitHub</text>
</g>
<rect x=".5" y=".5" width="839" height="131" rx="14" fill="none" stroke="#ffffff1c"/>
</svg>
