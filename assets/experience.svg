<rect x="492.7999999999999" y="602.4999999999999" width="98.1" height="25" rx="13.0" fill="#ffffff0a" stroke="#ffffff1f"/>
<text x="541.8" y="618.8" font-size="10.5" fill="#ffffffcc" text-anchor="middle" letter-spacing="0.05em" class="m">TIMESCALEDB</text>
<rect x="599.8749999999999" y="602.4999999999999" width="91.2" height="25" rx="13.0" fill="#ffffff0a" stroke="#ffffff1f"/>
<text x="645.5" y="618.8" font-size="10.5" fill="#ffffffcc" text-anchor="middle" letter-spacing="0.05em" class="m">PROMETHEUS</text>
