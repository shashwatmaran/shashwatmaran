<text x="735.5" y="618.8" font-size="10.5" fill="#ffffffcc" text-anchor="middle" letter-spacing="0.05em" class="m">GRAFANA</text>
<rect x="64.5" y="636.4999999999999" width="70.8" height="25" rx="13.0" fill="#ffffff0a" stroke="#ffffff1f"/>
