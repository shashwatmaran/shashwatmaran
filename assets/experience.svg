<svg xmlns="http://www.w3.org/2000/svg" width="840" height="720" viewBox="0 0 840 720" xml:space="preserve" role="img" aria-label="Experience: Software Engineering Intern at HCLTech, Chennai, May to July 2026. Built a real-time C++20 weather data pipeline and a low-latency Linux alerting service.">
<title>Experience: Software Engineering Intern at HCLTech, Chennai, May to July 2026. Built a real-time C++20 weather data pipeline and a low-latency Linux alerting service.</title>
<defs><clipPath id="panel"><rect width="840" height="720" rx="14"/></clipPath></defs>
<style>@font-face{font-family:'Aspekta';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'SiteMono';src:url(data:font/woff2;base64,) format('woff2');}.s{font-family:'Aspekta',Arial, sans-serif}.m{font-family:'SiteMono',ui-monospace, Menlo, Consolas, monospace}@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes pulse{0%{r:3.5px;opacity:.7}100%{r:11px;opacity:0}}.pulse{animation:pulse 2s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}text{white-space:pre}</style>
<g clip-path="url(#panel)">
<rect width="840" height="720" fill="#010101"/>
<text x="40.0" y="48.0" font-size="11.5" letter-spacing="0.08em" class="m fu"><tspan fill="#4a8eff">03</tspan><tspan fill="#ffffff99">   EXPERIENCE</tspan></text>
<line x1="175.3" y1="44.5" x2="800" y2="44.5" stroke="#ffffff1a"/>
<text x="40.0" y="98.0" font-size="34" fill="#ffffff" letter-spacing="-0.03em" class="s fu" style="animation-delay:0.08s">Where I've worked</text>
<text x="40.0" y="154.0" font-size="28" fill="#ffffff" letter-spacing="-0.03em" class="s fu" style="animation-delay:0.16s">HCLTech</text>
<text x="800.0" y="150.0" font-size="11" fill="#ffffff73" text-anchor="end" letter-spacing="0.08em" class="m">MAY — JUL 2026</text>
<text x="40.0" y="180.0" font-size="12" fill="#ffffff99" letter-spacing="0.02em" class="m fu" style="animation-delay:0.24s">Software Engineering Intern · Chennai, India</text>
<rect x="40.5" y="208.5" width="759" height="480.0" rx="12" fill="#ffffff05" stroke="#ffffff17"/>
<text x="64.0" y="246.0" font-size="10.5" fill="#4a8eff" letter-spacing="0.1em" class="m">PROJECT</text>
<text x="64.0" y="276.0" font-size="20" fill="#ffffff" letter-spacing="-0.015em" class="s">Real-time weather data pipeline &amp; alerting service</text>
<text x="64.0" y="306.0" font-size="14.5" fill="#ffffff99" class="s">A C++20 pipeline that ingests live weather data from the Open-Meteo API into TimescaleDB in three stages:</text>
<text x="64.0" y="329.2" font-size="14.5" fill="#ffffff99" class="s">multithreaded collectors, hierarchical aggregators and a batching writer.</text>
<rect x="64" y="351.9" width="8" height="2" fill="#0055df"/>
<text x="86.0" y="360.4" font-size="14" fill="#ffffff99" class="s">Fault-tolerant storage layer: transactional writes in batches of 250 rows, duplicate removal, and a file-based</text>
<text x="86.0" y="382.8" font-size="14" fill="#ffffff99" class="s">outbox that replays buffered data after database outages.</text>
<rect x="64" y="402.7" width="8" height="2" fill="#0055df"/>
<text x="86.0" y="411.2" font-size="14" fill="#ffffff99" class="s">Memory stays bounded under overload: queues are capped at 4,096 messages, and backpressure events are</text>
<text x="86.0" y="433.6" font-size="14" fill="#ffffff99" class="s">exported to Prometheus and shown in Grafana.</text>
<rect x="64" y="453.5" width="8" height="2" fill="#0055df"/>
<text x="86.0" y="462.0" font-size="14" fill="#ffffff99" class="s">Real-time alerting service built on a lock-free ring buffer with SCHED_FIFO scheduling, comparing live</text>
<text x="86.0" y="484.4" font-size="14" fill="#ffffff99" class="s">readings against hourly baselines.</text>
<rect x="64" y="504.3" width="8" height="2" fill="#0055df"/>
<text x="86.0" y="512.8" font-size="14" fill="#ffffff99" class="s">Two front ends: a Leaflet map console showing weather hazards and per-segment delays on freight corridors,</text>
<text x="86.0" y="535.2" font-size="14" fill="#ffffff99" class="s">and a Chart.js dashboard for historical analysis.</text>
<rect x="64" y="555.1" width="8" height="2" fill="#0055df"/>
<text x="86.0" y="563.6" font-size="14" fill="#ffffff99" class="s">Deployed with Docker Compose and systemd, with architecture and setup documentation.</text>
<rect x="64.5" y="602.4999999999999" width="57.1" height="25" rx="13.0" fill="#ffffff0a" stroke="#ffffff1f"/>
<text x="93.1" y="618.8" font-size="10.5" fill="#ffffffcc" text-anchor="middle" letter-spacing="0.05em" class="m">C++20</text>
