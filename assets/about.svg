<text x="40.0" y="48.0" font-size="11.5" letter-spacing="0.08em" class="m fu"><tspan fill="#4a8eff">01</tspan><tspan fill="#ffffff99">   ABOUT ME</tspan></text>
<line x1="159.66000000000003" y1="44.5" x2="800" y2="44.5" stroke="#ffffff1a"/>
<text x="40.0" y="98.0" font-size="34" fill="#ffffff" letter-spacing="-0.03em" class="s fu" style="animation-delay:0.08s">From raw disk sectors to production.</text>
<text x="40.0" y="144.0" font-size="16" fill="#ffffff99" class="s fu" style="animation-delay:0.16s">I'm an Integrated M.Tech (Software Engineering) student at VIT. As an intern at HCLTech I built a</text>
<text x="40.0" y="169.6" font-size="16" fill="#ffffff99" class="s fu" style="animation-delay:0.16s">real-time C++20 weather data pipeline and a low-latency Linux alerting service.</text>
<text x="40.0" y="207.2" font-size="16" fill="#ffffff99" class="s fu" style="animation-delay:0.24s">My own projects range from a raw-disk NTFS forensics toolkit written in pure Python, to a full-stack</text>
<text x="40.0" y="232.8" font-size="16" fill="#ffffff99" class="s fu" style="animation-delay:0.24s">expense platform with a native Android client deployed on AWS, to an offline learning platform for</text>
<text x="40.0" y="258.4" font-size="16" fill="#ffffff99" class="s fu" style="animation-delay:0.24s">schools without internet that runs on a Raspberry Pi. I'm most interested in systems software,</text>
<text x="40.0" y="284.0" font-size="16" fill="#ffffff99" class="s fu" style="animation-delay:0.24s">semiconductors and security.</text>
